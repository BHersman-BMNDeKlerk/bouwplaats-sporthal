<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouwplaatsinrichting – Sporthal Latourpad 16</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2a900'/%3E%3Cpath d='M6 24h20M9 24V12l7-5 7 5v12' stroke='%23222' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header id="toolbar">
      <div class="brand">
        <span class="logo">▲</span>
        <div>
          <div class="title">Bouwplaatsinrichting</div>
          <div class="subtitle" id="projectTitle">Sporthal Latourpad 16, Dordrecht</div>
        </div>
      </div>
      <div class="tools">
        <div class="group">
          <button id="btnLayers" title="Lagenpaneel in-/uitklappen (L)">☰ Lagen</button>
        </div>
        <div class="group">
          <button id="btnOpen" title="Project openen (Ctrl+O)">📂</button>
          <button id="btnSave" title="Project opslaan (Ctrl+S)">💾</button>
        </div>
        <div class="group">
          <div class="dropdown">
            <button id="btnImport" title="Inmeting, KLIC of DXF importeren">⇪ Import ▾</button>
            <div class="menu" id="menuImport" hidden>
              <button data-imp="grens">Ingemeten perceelgrens (CSV)…</button>
              <button data-imp="punten">Ingemeten punten met code (CSV)…</button>
              <button data-imp="klic">KLIC-levering (zip)…</button>
              <button data-imp="dxf">DXF-onderlegger…</button>
            </div>
          </div>
          <div class="dropdown">
            <button id="btnElement" title="Bouwplaatselement plaatsen">＋ Element ▾</button>
            <div class="menu" id="menuElement" hidden></div>
          </div>
          <div class="dropdown">
            <button id="btnRoute" title="Draai- en steekbeweging (swept path) tekenen">🚚 Route ▾</button>
            <div class="menu" id="menuRoute" hidden></div>
          </div>
          <div class="dropdown">
            <button id="btnCrane" title="Kraanopstelling en lastcontrole">🏗 Kraan ▾</button>
            <div class="menu" id="menuCrane" hidden></div>
          </div>
          <div class="dropdown">
            <button id="btnDraw" title="Eigen obstakels tekenen">✎ Tekenen ▾</button>
            <div class="menu" id="menuDraw" hidden>
              <button data-draw="doorrijhoogte-lijn">Vrije doorrijhoogte – lijn (kabel, tak, poort)</button>
              <button data-draw="doorrijhoogte-vlak">Vrije doorrijhoogte – vlak (viaduct, overkapping)</button>
              <button data-draw="paaltjes">Paaltjes</button>
              <button data-draw="hekwerk">Bouwhekken 3,50 × 2,00 m (met poorten)</button>
              <button data-draw="nietBerijdbaar">Niet berijdbaar vlak</button>
              <button data-draw="maatlijn">Maatlijn (ook kettingmaat)</button>
              <hr />
              <button data-draw="looproute">Looproute</button>
              <button data-draw="vluchtroute">Vluchtroute</button>
              <button data-draw="vrijvlak">Vrij vlak met label</button>
              <button data-draw="vrijelijn">Vrije lijn met label</button>
              <button data-draw="vergundeZone">Vergunde zone (bv. vergunning openbare weg)</button>
            </div>
          </div>
        </div>
        <div class="group">
          <button id="btnUndo" title="Ongedaan maken (Ctrl+Z)">↶</button>
          <button id="btnRedo" title="Opnieuw (Ctrl+Y)">↷</button>
        </div>
        <div class="group">
          <button id="btnTop" title="2D-bovenaanzicht zonder perspectief (T)">⬒ 2D</button>
          <button id="btnOblique" title="3D-aanzicht (P)">◩ 3D</button>
          <button id="btnMeasure" title="Afstand meten (M)">📏 Meten</button>
          <button id="btnSporthal" title="Zoom naar de sporthal (Z)">⌖</button>
        </div>
        <div class="group">
          <button id="btnExport" title="Exporteren: PDF op schaal, DXF, GeoJSON, PNG (E)">⇩ Export</button>
          <button id="btnSources" title="Herkomst en nauwkeurigheid van de data (B)">ⓘ</button>
          <button id="btnHelp" title="Handleiding (F1 of ?)">?</button>
        </div>
      </div>
      <input type="file" id="fileOpen" accept=".json,application/json" hidden />
      <input type="file" id="fileImport" hidden />
    </header>

    <main>
      <aside id="layers" class="panel"></aside>
      <div id="viewport">
        <div id="loading"><div class="spinner"></div><div id="loadingMsg">Laden…</div></div>
        <div id="tooltip" hidden></div>
        <button id="compass" title="Noord boven (N)"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#ffffffe6" stroke="#666"/><path d="M20 5 L25 21 L20 18 L15 21 Z" fill="#c62828"/><path d="M20 35 L25 19 L20 22 L15 19 Z" fill="#888"/><text x="20" y="15.5" font-size="7" text-anchor="middle" fill="#fff" font-weight="700">N</text></svg></button>
        <div id="warnings"></div>
        <div id="scalebar" hidden><div class="bar"></div><div class="lbl"></div><select id="schaalKeus" title="Vaste schaal op het scherm (bij 96 dpi)"><option value="">vrije schaal</option><option value="100">1:100</option><option value="200">1:200</option><option value="250">1:250</option><option value="500">1:500</option><option value="1000">1:1000</option></select></div>
      </div>
      <aside id="info" class="panel" hidden></aside>
    </main>

    <footer id="statusbar">
      <span id="stCoord">Beweeg de muis over de kaart</span>
      <span id="stHeight"></span>
      <span id="stMsg"></span>
      <span class="disclaimer">Indicatief hulpmiddel op basis van openbare bronnen – zie <a href="#" id="lnkSources">Bronnen</a>. BRK-perceelgrenzen zijn indicatief.</span>
    </footer>

    <div id="modal" hidden><div class="modal-box"><button class="close" title="Sluiten (Esc)">✕</button><div class="modal-content"></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
